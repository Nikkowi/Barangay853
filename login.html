<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Brgy. 853 Zone 93</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0b2250 0%, #1e3a8a 100%);
      padding: 2rem;
    }

    .login-card {
      background: #fff;
      border-radius: 1.5rem;
      padding: 3rem;
      width: 100%;
      max-width: 550px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      padding: 0.5rem;
      margin: 0 auto 1rem;
      display: block;
      object-fit: contain;
    }

    .login-header h1 {
      font-size: 1.5rem;
      color: #0f172a;
      font-weight: 600;
    }

    .login-subtitle {
      margin: 0.5rem 0 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }

    .form-group input {
      border: 1px solid #d5d8f0;
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    .form-group input[type="checkbox"] {
      width: auto;
      padding: 0;
      border: none;
      border-radius: 0;
      box-shadow: none;
      flex-shrink: 0;
    }

    .form-group input:focus {
      outline: none;
      border-color: #0b2250;
      box-shadow: 0 0 0 3px rgba(11,34,80,0.1);
    }

    .form-group input:disabled {
      background: #f1f5f9;
      cursor: not-allowed;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .error-msg {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      border: 1px solid rgba(239,68,68,0.2);
      display: none;
    }

    .success-msg {
      background: rgba(34,197,94,0.1);
      color: #16a34a;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      border: 1px solid rgba(34,197,94,0.2);
      display: none;
    }

    .login-btn {
      background: #0b2250;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
      margin-top: 0.5rem;
      width: 100%;
    }

    .login-btn:hover:not(:disabled) {
      background: #1e3a8a;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .create-account-btn {
      background: transparent;
      color: #2563eb;
      border: 2px solid #2563eb;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      margin-top: 1.5rem;
    }

    .create-account-btn:hover {
      background: #2563eb;
      color: #fff;
      transform: translateY(-1px);
    }

    .login-footer {
      margin-top: 2rem;
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid #e2e8f0;
    }

    .home-btn {
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      transition: color 0.2s ease;
    }

    .home-btn:hover {
      color: #1e3a8a;
      background: rgba(37,99,235,0.05);
    }

    .required { color: #ef4444; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #475569;
      cursor: pointer;
      font-weight: 400;
    }

    .hidden { display: none; }

    @media (max-width: 640px) {
      .login-card { padding: 2rem 1.5rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <img src="assets/logo-brgy.png" alt="Brgy. 853 Zone 93" class="login-logo">
    <h1>Brgy. 853 Zone 93</h1>
    <p class="login-subtitle">Tulong-Tulong Sama-Sama</p>
  </div>

  <!-- LOGIN FORM -->
  <div id="login-section">
    <div class="error-msg" id="login-error"></div>
    <div class="success-msg" id="login-success"></div>
    <div class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button class="login-btn" id="login-btn" onclick="handleLogin()">Sign In</button>
    </div>
    <button class="create-account-btn" onclick="showRegister()">Create Account</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="register-section" class="hidden">
    <div class="error-msg" id="reg-error"></div>
    <div class="success-msg" id="reg-success"></div>
    <div class="login-form">
      <div class="form-row">
        <div class="form-group">
          <label>First Name <span class="required">*</span></label>
          <input type="text" id="reg-firstname" placeholder="First name" required>
        </div>
        <div class="form-group">
          <label>Last Name <span class="required">*</span></label>
          <input type="text" id="reg-lastname" placeholder="Last name" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>
        <input type="email" id="reg-email" placeholder="your.email@example.com" required>
      </div>
      <div class="form-group">
        <label>Contact Number <span class="required">*</span></label>
        <input type="tel" id="reg-contact" placeholder="09XX-XXX-XXXX" required>
      </div>
      <div class="form-group">
        <label>Address <span class="required">*</span></label>
        <input type="text" id="reg-address" placeholder="Complete address" required>
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="reg-dob">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password <span class="required">*</span></label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password <span class="required">*</span></label>
          <input type="password" id="reg-confirm" placeholder="Re-enter password" required>
        </div>
      </div>
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" id="reg-terms">
          <span>I agree to the terms and conditions</span>
        </label>
      </div>
      <button class="login-btn" id="reg-btn" onclick="handleRegister()">Create Account</button>
    </div>
  </div>

  <div class="login-footer">
    <a href="index.html" class="home-btn">← Home Page</a>
  </div>
</div>

<script>
  const API = window.location.origin + '/Barangay853';

  function showRegister() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('register-section').classList.remove('hidden');
  }

  function showLogin() {
    document.getElementById('register-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError(id) {
    document.getElementById(id).style.display = 'none';
  }

  async function handleLogin() {
    hideError('login-error');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');

    if (!email || !password) {
      showError('login-error', 'Email and password are required');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      const res = await fetch(`${API}/auth/login.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!data.success) {
        showError('login-error', data.message || 'Login failed');
        return;
      }

      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));

      if (data.user.role === 'resident') {
        window.location.href = 'resident-dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }

    } catch (err) {
      showError('login-error', 'Cannot connect to server. Make sure XAMPP is running.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  async function handleRegister() {
    hideError('reg-error');
    const password = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;
    const terms = document.getElementById('reg-terms').checked;
    const btn = document.getElementById('reg-btn');

    if (password !== confirm) {
      showError('reg-error', 'Passwords do not match');
      return;
    }
    if (password.length < 6) {
      showError('reg-error', 'Password must be at least 6 characters');
      return;
    }
    if (!terms) {
      showError('reg-error', 'You must agree to the terms and conditions');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating Account...';

    try {
      const res = await fetch(`${API}/auth/register.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          first_name: document.getElementById('reg-firstname').value,
          last_name: document.getElementById('reg-lastname').value,
          email: document.getElementById('reg-email').value,
          password: password,
          contact_number: document.getElementById('reg-contact').value,
          address: document.getElementById('reg-address').value,
          date_of_birth: document.getElementById('reg-dob').value || null
        })
      });

      const data = await res.json();

      if (!data.success) {
        showError('reg-error', data.message || 'Registration failed');
        return;
      }

      document.getElementById('reg-success').textContent = 'Account created! Redirecting...';
      document.getElementById('reg-success').style.display = 'block';
      setTimeout(() => window.location.href = 'login.html', 1500);

    } catch (err) {
      showError('reg-error', 'Cannot connect to server. Make sure XAMPP is running.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  // Allow pressing Enter to login
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const loginVisible = !document.getElementById('login-section').classList.contains('hidden');
      if (loginVisible) handleLogin();
    }
  });
</script>

</body>
</html>
