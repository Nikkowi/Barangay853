            </svg>
          </span>
          <span>Family Tree</span>
        </li>

  4. Paste the entire <div id="section-familytree"> block below into
     the <main class="main-panel"> of dashboard.html alongside the

  5. The JS at the bottom of this file should be appended to the

<!-- ═══════════ JAVASCRIPT (append to dashboard.html's <script>) ═══════════ -->
<script id="ft-script">
(function () {
  'use strict';

  // ── Config ─────────────────────────────────────────────────
  const API_BASE = '/api';

  // ── State ──────────────────────────────────────────────────
  let ftAllHouseholds = [];
  let ftCurrentHH    = null;
  let ftCurrentData  = null;

  // ── Role appearance map ────────────────────────────────────
  const ROLES = {
    head:     { bg:'#EEF2FF', stroke:'#4F6FAA', text:'#2D4580', badge:'#4F6FAA', badgeText:'#fff', label:'Head of household' },
    spouse:   { bg:'#F0F7EA', stroke:'#5F9E5F', text:'#2A5A2A', badge:'#5F9E5F', badgeText:'#fff', label:'Spouse' },
    child:    { bg:'#FEF3EE', stroke:'#C06040', text:'#7A3820', badge:'#C06040', badgeText:'#fff', label:'Child' },
    sibling:  { bg:'#FEF3EE', stroke:'#C06040', text:'#7A3820', badge:'#C06040', badgeText:'#fff', label:'Sibling' },
    extended: { bg:'#F5F5F5', stroke:'#888',    text:'#444',    badge:'#888',    badgeText:'#fff', label:'Extended' },
    boarder:  { bg:'#FFF8F0', stroke:'#B08040', text:'#6A4820', badge:'#B08040', badgeText:'#fff', label:'Boarder' },
    other:    { bg:'#F5F5F5', stroke:'#888',    text:'#444',    badge:'#888',    badgeText:'#fff', label:'Member' },
  };

  // ── Helpers ────────────────────────────────────────────────
  function getAge(dob) {
    const d = new Date(dob), n = new Date();
    let a = n.getFullYear() - d.getFullYear();
    if (n.getMonth() < d.getMonth() ||
        (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) a--;
    return a;
  }
  function initials(name) {
    return name.split(' ').filter(Boolean).slice(0,2).map(w => w[0].toUpperCase()).join('');
  }
  function shortName(name) {
    const parts = name.split(' ').filter(Boolean);
    if (parts.length <= 2) return name;
    return parts[0] + ' ' + parts[parts.length - 1];
  }
  function authHeaders() {
    const token = localStorage.getItem('auth_token') || sessionStorage.getItem('auth_token') || '';
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  // ── Load household list ────────────────────────────────────
  window.ftLoadHouseholds = async function () {
    const listEl = document.getElementById('ft-hh-list');
    listEl.innerHTML = '<div class="ft-loading">Loading households…</div>';
    try {
      const res  = await fetch(API_BASE + '/households/', { headers: authHeaders() });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      ftAllHouseholds = json.data;
      ftRenderHHList(ftAllHouseholds);
    } catch (err) {
      listEl.innerHTML = `<div class="ft-empty" style="color:#ef4444">Failed to load households: ${err.message}</div>`;
    }
  };

  function ftRenderHHList(list) {
    const listEl = document.getElementById('ft-hh-list');
    if (!list.length) { listEl.innerHTML = '<div class="ft-empty">No households found</div>'; return; }
    listEl.innerHTML = list.map(h => `
      <div class="hh-item${ftCurrentHH === h.id ? ' active' : ''}"
           onclick="ftSelectHousehold(${h.id})" id="hh-item-${h.id}">
        <div class="hh-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <path d="M9 21V12h6v9"/>
          </svg>
        </div>
        <div style="min-width:0">
          <div class="hh-code">${h.household_code}</div>
          <div class="hh-addr" title="${h.address_line}">${h.address_line}</div>
          ${h.head_name ? `<div class="hh-addr" style="color:#0b2250;font-weight:600">👤 ${h.head_name}</div>` : ''}
        </div>
        <span class="hh-count">${h.member_count} member${h.member_count !== 1 ? 's' : ''}</span>
      </div>`).join('');
  }

  window.ftFilterHouseholds = function () {
    const q = document.getElementById('ft-hh-search').value.toLowerCase();
    const filtered = ftAllHouseholds.filter(h =>
      h.household_code.toLowerCase().includes(q) ||
      (h.address_line||'').toLowerCase().includes(q) ||
      (h.head_name||'').toLowerCase().includes(q));
    ftRenderHHList(filtered);
  };

  // ── Load + render a single household ──────────────────────
  window.ftSelectHousehold = async function (id) {
    ftCurrentHH = id;
    ftCloseDetail();
    document.querySelectorAll('.hh-item').forEach(el => el.classList.remove('active'));
    const item = document.getElementById('hh-item-' + id);
    if (item) item.classList.add('active');

    const wrap = document.getElementById('ft-svg-wrap');
    wrap.innerHTML = '<div class="ft-loading">Building family tree…</div>';
    document.getElementById('ft-tree-title').textContent = 'Loading…';
    document.getElementById('ft-tree-sub').textContent   = '';

    try {
      const res  = await fetch(`${API_BASE}/households/?id=${id}`, { headers: authHeaders() });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      ftCurrentData = json;
      ftRenderTree(json);
    } catch (err) {
      wrap.innerHTML = `<div class="ft-empty" style="color:#ef4444">Error: ${err.message}</div>`;
    }
  };

  // ── SVG Tree Renderer ──────────────────────────────────────
  function ftRenderTree(json) {
    const hh      = json.household;
    const members = json.members;

    document.getElementById('ft-tree-title').textContent = `${hh.household_code} — ${hh.address_line}`;
    document.getElementById('ft-tree-sub').textContent   =
      `${members.length} member${members.length !== 1 ? 's' : ''} · ${hh.zone || ''} · ${hh.barangay || ''}`;

    const CARD_W = 148, CARD_H = 116, GAP_X = 24, GAP_Y = 80;
    const TOTAL_W = 680;

    // Separate into tiers
    const head    = members.find(m => m.household_role === 'head') || members[0];
    const spouse  = members.find(m => m.household_role === 'spouse');
    const tier2   = members.filter(m => ['child','sibling'].includes(m.household_role));
    const tier3   = members.filter(m => ['extended','boarder','other'].includes(m.household_role)
                                         && m !== head && m !== spouse && !tier2.includes(m));

    let svgH = CARD_H + 40;
    if (tier2.length) svgH += GAP_Y + CARD_H;
    if (tier3.length) svgH += GAP_Y + CARD_H;

    let svg = `<svg width="100%" viewBox="0 0 ${TOTAL_W} ${svgH + 40}"
        role="img" aria-label="Family tree for ${hh.household_code}"
        style="font-family:'Inter','Segoe UI',system-ui,sans-serif;min-width:340px">
      <title>Family tree — ${hh.household_code}</title>
      <desc>${members.length} household members</desc>`;

    const drawn = new Set();

    // ── Tier 1: head + spouse ──────────────────────────────
    const headX  = spouse ? TOTAL_W/2 - CARD_W/2 - GAP_X/2 - CARD_W/2
                          : TOTAL_W/2 - CARD_W/2;
    const tier1Y = 20 + CARD_H/2;

    if (spouse) {
      const spouseX = TOTAL_W/2 + GAP_X/2 + CARD_W/2;
      // Marriage line
      svg += `<line x1="${headX + CARD_W/2}" y1="${tier1Y}" x2="${spouseX - CARD_W/2}" y2="${tier1Y}"
        stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="${TOTAL_W/2}" cy="${tier1Y}" r="4" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>`;
      svg += ftCard(head,   headX,   tier1Y, CARD_W, CARD_H);
      svg += ftCard(spouse, spouseX, tier1Y, CARD_W, CARD_H);
      drawn.add(head.id); drawn.add(spouse.id);
    } else {
      svg += ftCard(head, headX + CARD_W/2, tier1Y, CARD_W, CARD_H);
      drawn.add(head.id);
    }

    const tier1MidX = TOTAL_W / 2;
    const tier1BotY = tier1Y + CARD_H/2;

    // ── Tier 2: children / siblings ────────────────────────
    if (tier2.length) {
      const tier2Y    = tier1Y + CARD_H/2 + GAP_Y + CARD_H/2;
      const totalRowW = tier2.length * CARD_W + (tier2.length - 1) * GAP_X;
      const rowStartX = TOTAL_W/2 - totalRowW/2 + CARD_W/2;

      // Drop line from couple midpoint
      const dropBotY = tier2Y - CARD_H/2 - 16;
      svg += `<line x1="${tier1MidX}" y1="${tier1BotY}" x2="${tier1MidX}" y2="${dropBotY}"
        stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>`;

      if (tier2.length > 1) {
        const leftX  = rowStartX;
        const rightX = rowStartX + (tier2.length - 1) * (CARD_W + GAP_X);
        svg += `<line x1="${leftX}" y1="${dropBotY}" x2="${rightX}" y2="${dropBotY}"
          stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>`;
      }

      tier2.forEach((m, i) => {
        const cx = rowStartX + i * (CARD_W + GAP_X);
        svg += `<line x1="${cx}" y1="${dropBotY}" x2="${cx}" y2="${tier2Y - CARD_H/2}"
          stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>`;
        svg += ftCard(m, cx, tier2Y, CARD_W, CARD_H);
        drawn.add(m.id);
      });
    }

    // ── Tier 3: extended / boarders / other ────────────────
    if (tier3.length) {
      const prevBotY  = tier2.length
        ? (tier1Y + CARD_H/2 + GAP_Y + CARD_H)
        : (tier1Y + CARD_H/2);
      const tier3Y    = prevBotY + GAP_Y + CARD_H/2;
      const totalRowW = tier3.length * CARD_W + (tier3.length - 1) * GAP_X;
      const rowStartX = TOTAL_W/2 - totalRowW/2 + CARD_W/2;

      // Dashed bracket
      svg += `<line x1="${tier1MidX}" y1="${prevBotY}" x2="${tier1MidX}" y2="${tier3Y - CARD_H/2 - 16}"
        stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>`;
      if (tier3.length > 1) {
        const lx = rowStartX, rx = rowStartX + (tier3.length-1)*(CARD_W+GAP_X);
        svg += `<line x1="${lx}" y1="${tier3Y - CARD_H/2 - 16}" x2="${rx}" y2="${tier3Y - CARD_H/2 - 16}"
          stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>`;
      }
      tier3.forEach((m, i) => {
        const cx = rowStartX + i * (CARD_W + GAP_X);
        svg += `<line x1="${cx}" y1="${tier3Y - CARD_H/2 - 16}" x2="${cx}" y2="${tier3Y - CARD_H/2}"
          stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 4"/>`;
        svg += ftCard(m, cx, tier3Y, CARD_W, CARD_H);
        drawn.add(m.id);
      });
    }

    // ── Any members not yet placed (fallback single row) ───
    const undrawn = members.filter(m => !drawn.has(m.id));
    if (undrawn.length) {
      const fallY     = svgH - CARD_H/2;
      const totalRowW = undrawn.length * CARD_W + (undrawn.length - 1) * GAP_X;
      const rowStartX = TOTAL_W/2 - totalRowW/2 + CARD_W/2;
      undrawn.forEach((m, i) => {
        const cx = rowStartX + i * (CARD_W + GAP_X);
        svg += ftCard(m, cx, fallY, CARD_W, CARD_H);
      });
    }

    svg += '</svg>';
    document.getElementById('ft-svg-wrap').innerHTML = svg;

    // Attach click handlers after DOM insertion
    document.getElementById('ft-svg-wrap').querySelectorAll('[data-member-id]')
      .forEach(el => {
        el.addEventListener('click', () => {
          const id = parseInt(el.dataset.memberId);
          ftShowDetail(id);
        });
        el.addEventListener('mouseenter', () => {
          el.querySelector('rect').style.filter = 'brightness(.93)';
        });
        el.addEventListener('mouseleave', () => {
          el.querySelector('rect').style.filter = '';
        });
      });
  }

  function ftCard(m, cx, cy, w, h) {
    const rc  = ROLES[m.household_role] || ROLES.other;
    const age = getAge(m.date_of_birth);
    const ini = initials(m.full_name);
    const sn  = shortName(m.full_name);
    const gen = m.gender === 'Female' ? '♀' : '♂';

    let extraBadges = '';
    let bx = cx - w/2 + 10;
    if (m.is_senior_citizen) {
      extraBadges += `<rect x="${bx}" y="${cy + h/2 - 18}" width="44" height="13" rx="6"
        fill="#E0A020" opacity=".9"/>
        <text font-size="9" fill="#fff" x="${bx+22}" y="${cy + h/2 - 9}"
          text-anchor="middle" dominant-baseline="central">Senior</text>`;
      bx += 50;
    }
    if (m.is_pwd) {
      extraBadges += `<rect x="${bx}" y="${cy + h/2 - 18}" width="32" height="13" rx="6"
        fill="#8060A0" opacity=".9"/>
        <text font-size="9" fill="#fff" x="${bx+16}" y="${cy + h/2 - 9}"
          text-anchor="middle" dominant-baseline="central">PWD</text>`;
    }

    // Photo or initials avatar
    const avatarEl = m.photo_url
      ? `<image href="${m.photo_url}" x="${cx-14}" y="${cy - h/2 + 10}"
           width="28" height="28" clip-path="url(#cp-${m.id})"/>`
      : `<text font-size="12" font-weight="600" fill="${rc.stroke}"
           x="${cx}" y="${cy - h/2 + 26}" text-anchor="middle" dominant-baseline="central">${ini}</text>`;

    return `
    <defs><clipPath id="cp-${m.id}"><circle cx="${cx}" cy="${cy - h/2 + 24}" r="14"/></clipPath></defs>
    <g class="ft-card-g" data-member-id="${m.id}" style="cursor:pointer">
      <rect x="${cx - w/2}" y="${cy - h/2}" width="${w}" height="${h}" rx="10"
        fill="${rc.bg}" stroke="${rc.stroke}" stroke-width="1.2"
        style="transition:filter .15s"/>
      <circle cx="${cx}" cy="${cy - h/2 + 24}" r="14" fill="${rc.stroke}" fill-opacity=".14"/>
      ${avatarEl}
      <text font-size="11" font-weight="600" fill="${rc.text}"
        x="${cx}" y="${cy - h/2 + 50}" text-anchor="middle" dominant-baseline="central"
        style="max-width:${w-16}px">${sn}</text>
      <text font-size="10" fill="${rc.stroke}"
        x="${cx}" y="${cy - h/2 + 64}" text-anchor="middle" dominant-baseline="central">
          ${age}y ${gen}
      </text>
      <rect x="${cx - 34}" y="${cy - h/2 + 74}" width="68" height="14" rx="7" fill="${rc.badge}" opacity=".92"/>
      <text font-size="9" fill="${rc.badgeText}"
        x="${cx}" y="${cy - h/2 + 84}" text-anchor="middle" dominant-baseline="central">${rc.label}</text>
      ${extraBadges}
    </g>`;
  }

  // ── Detail panel ──────────────────────────────────────────
  function ftShowDetail(memberId) {
    if (!ftCurrentData) return;
    const m = ftCurrentData.members.find(x => x.id === memberId);
    if (!m) return;

    const rc  = ROLES[m.household_role] || ROLES.other;
    const age = getAge(m.date_of_birth);

    const avatar = document.getElementById('ft-d-avatar');
    avatar.textContent        = initials(m.full_name);
    avatar.style.background   = rc.bg;
    avatar.style.color        = rc.stroke;
    avatar.style.border       = `2px solid ${rc.stroke}`;

    document.getElementById('ft-d-name').textContent = m.full_name;

    const badges = [`<span class="ft-badge" style="background:${rc.badge};color:${rc.badgeText}">${rc.label}</span>`];
    if (m.is_senior_citizen) badges.push(`<span class="ft-badge" style="background:#E0A020;color:#fff">Senior citizen</span>`);
    if (m.is_pwd)            badges.push(`<span class="ft-badge" style="background:#8060A0;color:#fff">PWD${m.pwd_type ? ' · ' + m.pwd_type : ''}</span>`);
    document.getElementById('ft-d-badges').innerHTML = badges.join('');

    const info = [
      ['Age',             `${age} years old`],
      ['Date of birth',   m.date_of_birth],
      ['Gender',          m.gender],
      ['Civil status',    m.civil_status],
      ['Religion',        m.religion || '—'],
      ['Nationality',     m.nationality || '—'],
      ['Mobile',          m.contact_mobile || '—'],
      ['Email',           m.contact_email  || '—'],
      ['Resident type',   m.resident_type  || '—'],
      ['Registered voter',m.registered_voter ? 'Yes' : 'No'],
      ['Employment',      m.employment_status || '—'],
      ['Employer / School', m.employer_name   || '—'],
      ['Income range',    m.monthly_income_range || '—'],
    ];
    if (m.chronic_illnesses) info.push(['Chronic illness', m.chronic_illnesses]);

    document.getElementById('ft-d-grid').innerHTML = info
      .map(([l, v]) => `<div class="ft-info-row">
        <span class="ft-info-label">${l}</span>
        <span class="ft-info-val">${v}</span>
      </div>`).join('');

    const ecHTML = m.ec_name
      ? `<div class="ft-ec-label">Emergency contact</div>
         <div class="ft-ec-val">${m.ec_name}</div>
         <div class="ft-ec-rel">${m.ec_relationship} · ${m.ec_contact || ''}</div>`
      : `<div class="ft-ec-label">Emergency contact</div>
         <div class="ft-ec-val" style="color:#94a3b8">Not recorded</div>`;
    document.getElementById('ft-d-ec').innerHTML = ecHTML;

    const panel = document.getElementById('ft-detail');
    panel.classList.add('show');
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  window.ftCloseDetail = function () {
    document.getElementById('ft-detail').classList.remove('show');
  };

  // ── Auto-load when section becomes active ─────────────────
  // Hooks into the existing switchSection() function in dashboard.html
  const _origSwitch = window.switchSection;
  if (typeof _origSwitch === 'function') {
    window.switchSection = function (name, el) {
      _origSwitch(name, el);
      if (name === 'familytree' && ftAllHouseholds.length === 0) {
        ftLoadHouseholds();
      }
    };
  } else {
    // Fallback: if switchSection isn't defined yet, load on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', () => {
      const navItem = document.querySelector('[onclick*="familytree"]');
      if (navItem) {
        navItem.addEventListener('click', () => {
          if (ftAllHouseholds.length === 0) ftLoadHouseholds();
        });
      }
    });
  }

})();
</script>
